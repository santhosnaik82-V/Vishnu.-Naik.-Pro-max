name: Build VISHNU PRO MAX APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check source ZIP
        run: |
          if [ ! -f source.zip ]; then
            echo "ERROR: source.zip was not found in the repository root."
            echo "Repository files:"
            ls -la
            exit 1
          fi

      - name: Extract Android project
        run: |
          mkdir -p source
          unzip -q source.zip -d source
          echo "Extracted files:"
          find source -maxdepth 4 -type f | head -100

      - name: Find Gradle project
        id: project
        run: |
          PROJECT_DIR="$(find source -type f -name gradlew -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No gradlew found in source.zip."
            echo "The ZIP must contain a complete Android Gradle project."
            exit 1
          fi
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Build debug APK
        run: |
          cd "${{ steps.project.outputs.dir }}"
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VISHNU-PRO-MAX-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

This workflow expects `source.zip` to be in the **repository root** and to contain a complete Android project with a `gradlew` file. The Gradle Wrapper is the recommended way to run a Gradle build.

## Step 2: Save and run

1. Tap **Commit changes**.
2. Open **Actions**.
3. Open **Build VISHNU PRO MAX APK**.
4. Wait for the run to finish.

## Step 3: Download the APK

If the workflow succeeds:

1. Open the successful run.
2. Scroll to **Artifacts**.
3. Tap **VISHNU-PRO-MAX-APK** to download it.

**Important:** This fixes the workflow's folder handling and updates the Java/checkout actions, but it cannot guarantee a successful build if `source.zip` is missing, incomplete, or contains incompatible Android code. If it fails again, send me the new error log so we can fix the actual cause.
