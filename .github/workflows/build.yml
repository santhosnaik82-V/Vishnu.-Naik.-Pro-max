name: Build VISHNU PRO MAX APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip -q source.zip -d source
          cd source/VISHNU_PRO_MAX_ANDROID_PROJECT

      - name: Build APK
        run: |
          cd source/VISHNU_PRO_MAX_ANDROID_PROJECT
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VISHNU-PRO-MAX-APK
          path: source/VISHNU_PRO_MAX_ANDROID_PROJECT/app/build/outputs/apk/debug/app-debug.apk
